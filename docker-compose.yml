# Kaspa one-click node stack.
#
# This file is used by two different clients: the installer running on the host,
# and the manager container running `docker compose` against the same stack.
# That split decides how each path must be written:
#
#   volumes:       resolved by the Docker *daemon*, so they must be host paths
#                  -> always ${STACK_DIR}/..., never relative.
#   build.context: resolved by the *client* before upload, so it must be
#                  relative -> ./kaspad resolves to $STACK_DIR/kaspad on the host
#                  and to /stack/kaspad inside the manager, both correct.
#
# Getting either backwards produces mounts pointing at nothing.
#
# kaspad publishes no ports here on purpose -- the port mappings live in the
# generated override at conf/ports.yml so the web UI can toggle them. Compose
# concatenates `ports` across files, so the base must leave the list empty.

name: kaspa-node

services:
  kaspad:
    image: kaspa-one-click/kaspad:${KASPAD_VERSION:-v2.0.1}
    build:
      context: ./kaspad
      args:
        KASPAD_VERSION: ${KASPAD_VERSION:-v2.0.1}
        REPO_URL: ${KASPAD_REPO_URL:-https://github.com/kaspanet/rusty-kaspa}
    container_name: kaspa-node-kaspad
    hostname: kaspad
    restart: unless-stopped
    stop_grace_period: 180s
    volumes:
      - kaspad-data:/data
      - ${STACK_DIR}/conf:/conf:ro
    networks:
      - kaspa
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  # Stratum bridge: lets ASICs and miners point at this node.
  #
  # It sits behind the "mining" profile so a plain `docker compose up -d` (what
  # the installer runs) leaves it down. The control panel brings it up with
  # `--profile mining` when you enable mining, and removes it when you don't.
  # Stratum port mappings live in the generated conf/bridge-ports.yml, same
  # arrangement as kaspad's.
  bridge:
    image: kaspa-one-click/bridge:${KASPAD_VERSION:-v2.0.1}
    build:
      context: ./bridge
      args:
        KASPAD_VERSION: ${KASPAD_VERSION:-v2.0.1}
        REPO_URL: ${KASPAD_REPO_URL:-https://github.com/kaspanet/rusty-kaspa}
    container_name: kaspa-node-bridge
    hostname: bridge
    profiles: ["mining"]
    restart: unless-stopped
    stop_grace_period: 30s
    volumes:
      - bridge-data:/data
      - ${STACK_DIR}/conf:/conf:ro
    networks:
      - kaspa
    # No depends_on: kaspad. It reads like documentation of what the bridge
    # needs, and compose reads it as permission to start the node: installing
    # the bridge built kaspad from source and started it, on a machine where
    # nobody had asked for a node yet. Nothing here starts anything else.
    #
    # Nothing is lost by dropping it. depends_on only orders a `compose up`
    # that names both, and it is ignored entirely when docker restarts
    # containers after a reboot. The bridge retries its gRPC connection until
    # the node is there, which is the same thing it does whenever kaspad
    # restarts underneath it.
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  # ---- KaChat indexer -------------------------------------------------------
  #
  # Behind the "kachat" profile, so it only exists once enabled in the panel.
  #
  # Upstream ships its own kaspad, Postgres, Portainer and nginx-proxy-manager.
  # Only Postgres is kept: this stack already has a node (reached over the
  # internal network, no second chain sync) and its own reverse proxy, and a
  # second nginx would fight for ports 80/443.
  kachat-db:
    image: postgres:17-alpine
    container_name: kaspa-node-kachat-db
    hostname: kachat-db
    profiles: ["kachat"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${KACHAT_DB_USER:-kachat}
      POSTGRES_PASSWORD: ${KACHAT_DB_PASSWORD:-}
      POSTGRES_DB: ${KACHAT_DB_NAME:-kachat}
    volumes:
      - kachat-db-data:/var/lib/postgresql/data
    networks:
      - kaspa
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${KACHAT_DB_USER:-kachat}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  kachat-app:
    image: kaspa-one-click/kachat:${KACHAT_REF:-main}
    build:
      # Built straight from the repository -- no host clone to keep in sync.
      # Changing KACHAT_REF and rebuilding is what the panel's update button does.
      context: ${KACHAT_REPO:-https://github.com/KaspaSilver/KaChat-Indexer.git}#${KACHAT_REF:-main}
      dockerfile: docker/kachat/Dockerfile.kachat-app
    container_name: kaspa-node-kachat
    hostname: kachat-app
    profiles: ["kachat"]
    restart: unless-stopped
    # The chat indexer needs time to flush its store; killing it mid-compaction
    # corrupts the LSM metadata partition (upstream docs/RECOVERY-chat-metadata).
    stop_grace_period: 90s
    environment:
      # Our node, over the internal network. BORSH wRPC is what it wants.
      KASPA_NODE_ADDRESS: kaspad
      KASPA_NODE_PORT: ${KACHAT_NODE_PORT:-17110}
      KASPA_NODE_WBORSH_URL: ws://kaspad:${KACHAT_NODE_PORT:-17110}
      NETWORK: ${KACHAT_NETWORK:-mainnet}
      NETWORK_TYPE: ${KACHAT_NETWORK:-mainnet}
      DB_USER: ${KACHAT_DB_USER:-kachat}
      DB_PASSWORD: ${KACHAT_DB_PASSWORD:-}
      DB_NAME: ${KACHAT_DB_NAME:-kachat}
      DB_PORT: 5432
      DB_HOST: kachat-db
      SKI_PORT: 8500
      WEBSERVER_PORT: 3080
      ADMIN_PORT: 3081
      CHAT_API_PORT: 8600
      KASIA_INDEXER_DB_ROOT: /app/data
      KASIA_API_BIND: 0.0.0.0:8600
      # Upstream defaults this to 127.0.0.1:5000, which under host networking
      # is the LibreTranslate beside it. Here it is a container of its own.
      LIBRETRANSLATE_URL: ${LIBRETRANSLATE_URL:-http://libretranslate:5000}
      INTERNAL_PUSH_SECRET: ${KACHAT_PUSH_SECRET:-}
      FCM_PROJECT_ID: ${KACHAT_FCM_PROJECT_ID:-}
      FCM_SERVICE_ACCOUNT_PATH: /app/data/fcm/service-account.json
      RUST_LOG: info
    volumes:
      - kachat-app-data:/app/data
      # Upstream runs these containers with host networking, so its launch
      # scripts hardcode localhost as the database and bind the admin API to
      # loopback. Neither holds on a bridge network. These are the same scripts
      # with the host pointed at the database container, and the admin API bound
      # so the panel can reach it. See kachat/README.md for the detail.
      - ${STACK_DIR}/kachat/run-admin.sh:/app/run-admin.sh:ro
      - ${STACK_DIR}/kachat/run-webserver.sh:/app/run-webserver.sh:ro
      - ${STACK_DIR}/kachat/run-processor.sh:/app/run-processor.sh:ro
      - ${STACK_DIR}/kachat/run-ingest.sh:/app/run-ingest.sh:ro
    networks:
      - kaspa
    # Its own database, and nothing else. kaspad is deliberately not here: see
    # the bridge above. The indexer waits for the node in its own retry loop.
    depends_on:
      - kachat-db
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "3" }

  # ---- Nextcloud ------------------------------------------------------------
  #
  # Behind the "nextcloud" profile. Upstream's compose also brings its own
  # nginx-proxy-manager, Portainer and DuckDNS updater; all three are dropped
  # because this stack already provides those, and NPM would collide on 80/443.
  nextcloud-db:
    image: mariadb:10.11
    container_name: kaspa-node-nextcloud-db
    hostname: nextcloud-db
    profiles: ["nextcloud"]
    restart: unless-stopped
    command: --transaction-isolation=READ-COMMITTED --log-bin=binlog --binlog-format=ROW
    environment:
      MARIADB_ROOT_PASSWORD: ${NEXTCLOUD_DB_ROOT_PASSWORD:-}
      MARIADB_DATABASE: nextcloud
      MARIADB_USER: nextcloud
      MARIADB_PASSWORD: ${NEXTCLOUD_DB_PASSWORD:-}
    volumes:
      - nextcloud-db-data:/var/lib/mysql
    networks:
      - kaspa
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  nextcloud-redis:
    image: redis:7-alpine
    container_name: kaspa-node-nextcloud-redis
    hostname: nextcloud-redis
    profiles: ["nextcloud"]
    restart: unless-stopped
    networks:
      - kaspa
    logging:
      driver: json-file
      options: { max-size: "5m", max-file: "2" }

  # Generates image previews, including iPhone HEIC.
  nextcloud-imaginary:
    image: nextcloud/aio-imaginary:latest
    container_name: kaspa-node-nextcloud-imaginary
    hostname: nextcloud-imaginary
    profiles: ["nextcloud"]
    restart: unless-stopped
    cap_add: ["SYS_NICE"]
    environment:
      IMAGINARY_SECRET: ${NEXTCLOUD_IMAGINARY_SECRET:-}
    networks:
      - kaspa
    logging:
      driver: json-file
      options: { max-size: "5m", max-file: "2" }

  kachat-desktop:
    image: kaspa-one-click/kachat-desktop:${KACHAT_DESKTOP_REF:-main}
    build:
      # Built straight from the repository, which now carries its own
      # Dockerfile -- no second copy here to drift out of step with it.
      # Changing KACHAT_DESKTOP_REF and rebuilding is what the panel's update
      # button does.
      context: ${KACHAT_DESKTOP_REPO:-https://github.com/KaspaSilver/KaChat-Desktop.git}#${KACHAT_DESKTOP_REF:-main}
      dockerfile: Dockerfile
    container_name: kaspa-node-kachat-desktop
    hostname: kachat-desktop
    profiles: ["kachat-desktop"]
    restart: unless-stopped
    networks:
      - kaspa
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    logging:
      driver: json-file
      options: { max-size: "5m", max-file: "2" }

  # ---- KaChat gift service --------------------------------------------------
  #
  # Behind the "gift" profile, like the other apps. It holds a wallet key and
  # store credentials, so its configuration is mounted read-only from the
  # stack's own conf directory and nothing sensitive is ever built into the
  # image or written into the repository it is built from.
  gift:
    image: kaspa-one-click/gift:${GIFT_REF:-main}
    build:
      context: ${GIFT_REPO:-https://github.com/KaspaSilver/KaChat-Gift-Service.git}#${GIFT_REF:-main}
      dockerfile: Dockerfile
    container_name: kaspa-node-gift
    hostname: gift
    profiles: ["gift"]
    restart: unless-stopped
    environment:
      GIFT_CONF: /conf/gift.json
      GIFT_DATA: /data
    volumes:
      # Read-only: the service reads its key, it never rewrites it.
      - ${STACK_DIR}/conf/gift:/conf:ro
      - gift-data:/data
    networks:
      - kaspa
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8770/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # The official image plus ffmpeg, which is what generates video thumbnails.
  # Nothing here comes from a repository of ours: the panel's update button
  # checks the nextcloud:stable tag on Docker Hub and rebuilds on whatever it
  # currently points at.
  nextcloud:
    image: kaspa-one-click/nextcloud:1
    build:
      context: ./nextcloud
    container_name: kaspa-node-nextcloud
    hostname: nextcloud
    profiles: ["nextcloud"]
    restart: unless-stopped
    environment:
      MYSQL_HOST: nextcloud-db
      MYSQL_DATABASE: nextcloud
      MYSQL_USER: nextcloud
      MYSQL_PASSWORD: ${NEXTCLOUD_DB_PASSWORD:-}
      REDIS_HOST: nextcloud-redis
      NEXTCLOUD_ADMIN_USER: ${NEXTCLOUD_ADMIN_USER:-admin}
      NEXTCLOUD_ADMIN_PASSWORD: ${NEXTCLOUD_ADMIN_PASSWORD:-}
      NEXTCLOUD_TRUSTED_DOMAINS: ${NEXTCLOUD_TRUSTED_DOMAINS:-localhost}
      TRUSTED_PROXIES: 172.16.0.0/12
      # Read by previews.config.php, and only used when Imaginary was given one.
      NEXTCLOUD_IMAGINARY_SECRET: ${NEXTCLOUD_IMAGINARY_SECRET:-}
    volumes:
      - nextcloud-data:/var/www/html
      # The image loads every *.config.php in that directory. Mounted rather
      # than baked in, so it can be corrected without a rebuild, and read-only
      # so Nextcloud's own config writes never land in it.
      - ${STACK_DIR}/nextcloud/previews.config.php:/var/www/html/config/previews.config.php:ro
    networks:
      - kaspa
    depends_on:
      - nextcloud-db
      - nextcloud-redis
      - nextcloud-imaginary
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
  # ---- KaChat Bot -----------------------------------------------------------
  #
  # Watches this node for block rewards landing on a mining address and sends
  # each one to a phone as an encrypted KaChat message. Built from
  # KaspaSilver/Kaspa-Block-Notifier, the same way the indexer is built from its
  # own repository, so the panel's update button moves it forward.
  #
  # Upstream reaches the node through host-gateway, because it assumes a node
  # running on the docker host. Here the node is a container on this network, so
  # it is named directly and nothing has to be published to the host for the bot
  # to work.
  #
  # It holds a wallet key, which is why its settings are a file mounted from
  # conf/bot rather than values in .env: that file is written 0600 by the panel
  # and .env is not.
  kachat-bot:
    image: kaspa-one-click/kachat-bot:${BOT_REF:-main}
    build:
      context: ${BOT_REPO:-https://github.com/KaspaSilver/Kaspa-Block-Notifier.git}#${BOT_REF:-main}
    container_name: kaspa-node-kachat-bot
    hostname: kachat-bot
    profiles: ["bot"]
    restart: unless-stopped
    environment:
      # The node on this network, not the docker host. Ports follow the network,
      # the same way the indexer's do.
      NODE_GRPC: kaspad:${BOT_NODE_GRPC_PORT:-16110}
      NODE_WRPC: ws://kaspad:${BOT_NODE_BORSH_PORT:-17110}
      KASPA_NETWORK: ${BOT_NETWORK:-mainnet}
      PYTHONUNBUFFERED: "1"
    # Everything that identifies a wallet lives here, written by the panel and
    # readable only by its owner. `required: false` so a stack that has never
    # set the bot up can still run every other compose command.
    env_file:
      - path: ./conf/bot/bot.env
        required: false
    networks:
      - kaspa
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # ---- Translation ----------------------------------------------------------
  #
  # The engine behind the indexer's POST /translate: KaPosts are translated
  # server-side and cached forever, because a post is immutable so a translation
  # of it is correct permanently.
  #
  # Its own profile rather than part of the KaChat unit. Upstream runs it beside
  # the indexer, but it is several gigabytes of language models and wants 4GB of
  # RAM, which is not something to hand somebody who only asked for a chat
  # index. Install it from the indexer's Translation tab when it is wanted.
  #
  # Not published to the host either, where upstream binds it to loopback: on
  # this stack's private network only the webserver and the admin API can reach
  # it, and it needs no authentication because nothing else can.
  libretranslate:
    image: libretranslate/libretranslate:latest
    container_name: kaspa-node-libretranslate
    hostname: libretranslate
    profiles: ["translate"]
    restart: unless-stopped
    # Root so it can write models into the named volume. The image's own user
    # cannot: the argos directory is not baked into the image, so docker has
    # nothing to chown the volume against, and a fresh install fails to download
    # a single model. Upstream does the same, for the same reason.
    user: "0:0"
    mem_limit: ${LT_MEMORY:-4g}
    environment:
      # Every loaded language is a model held in memory. Ten is upstream's
      # default and already a few gigabytes.
      LT_LOAD_ONLY: ${LT_LOAD_ONLY:-en,es,pt,fr,de,ru,zh,ja,ko,ar,vi}
      LT_DISABLE_WEB_UI: "true"
      LT_THREADS: ${LT_THREADS:-4}
    volumes:
      - libretranslate-models:/home/libretranslate/.local/share/argos-translate
    networks:
      - kaspa
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:5000/languages', timeout=5).status==200 else 1)\" || exit 1"]
      interval: 30s
      timeout: 10s
      # The first start downloads every model it was asked to load, which on a
      # slow line is many minutes. Unhealthy before that is not a failure.
      start_period: 600s
      retries: 5
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }


  manager:
    image: kaspa-one-click/manager:1
    build:
      context: ./manager
    container_name: kaspa-node-manager
    hostname: manager
    restart: unless-stopped
    environment:
      STACK_DIR: ${STACK_DIR}
      COMPOSE_PROJECT_NAME: kaspa-node
      KASPAD_SERVICE: kaspad
      KASPAD_CONTAINER: kaspa-node-kaspad
      PROXY_CONTAINER: kaspa-node-proxy
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
      UPSTREAM_REPO: ${UPSTREAM_REPO:-kaspanet/rusty-kaspa}
      GUI_PORT: ${GUI_PORT:-8080}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${STACK_DIR}:/stack
    ports:
      - "${MANAGER_BIND:-0.0.0.0}:${GUI_PORT:-8080}:8080"
    networks:
      - kaspa
    # No depends_on: kaspad, deliberately. The panel is what starts the node,
    # so it has to come up whether or not the node exists -- and a dependency
    # would start kaspad again on every `up -d manager`, quietly undoing the
    # panel's own stop button. The panel finds the node by hostname once it
    # exists, and reports it as stopped until then.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Reverse proxy for domains and HTTPS. Behind a profile like the optional
  # apps: it claims ports 80 and 443, which is rude on a machine that may
  # already serve something there, and a node with no domains does not need it.
  proxy:
    image: nginx:1.27-alpine
    container_name: kaspa-node-proxy
    hostname: proxy
    profiles: ["proxy"]
    restart: unless-stopped
    volumes:
      - ${STACK_DIR}/proxy/conf.d:/etc/nginx/conf.d:ro
      - ${STACK_DIR}/proxy/snippets:/etc/nginx/snippets:ro
      - ${STACK_DIR}/proxy/letsencrypt:/etc/letsencrypt:ro
      - ${STACK_DIR}/proxy/webroot:/var/www/certbot
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    networks:
      - kaspa
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  kaspa:
    name: kaspa-node-net

volumes:
  kaspad-data:
    name: kaspa-node-data
  bridge-data:
    name: kaspa-node-bridge-data
  kachat-db-data:
    name: kaspa-node-kachat-db-data
  kachat-app-data:
    name: kaspa-node-kachat-app-data
  nextcloud-db-data:
    name: kaspa-node-nextcloud-db-data
  nextcloud-data:
    name: kaspa-node-nextcloud-data
  gift-data:
    name: kaspa-node-gift-data
  libretranslate-models:
    name: kaspa-node-libretranslate-models
