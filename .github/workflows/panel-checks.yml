name: Panel checks

# Cheap checks on every push: the panel's JavaScript parses, and its user-facing text has no
# em dashes (kachat-audits KQS-022).
on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Nothing here pushes, so the job token is not left in .git/config.
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: JavaScript parses
        run: for f in manager/server.js manager/lib/*.js manager/public/app.js; do node --check "$f"; done
      - name: No em dashes in panel text
        run: node scripts/check-no-em-dash.mjs
