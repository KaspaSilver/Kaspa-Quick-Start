name: Desktop installer release

# Builds the Kaspa Quick Start desktop installer for Windows, macOS and Linux and
# publishes the artifacts to a GitHub Release. Triggered by a version tag, which
# electron-builder also uses as the release tag (so git tag == release tag):
#   git tag v1.0.0 && git push origin v1.0.0
on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop-installer
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      # Import the Developer ID cert into a keychain WE control, rather than let
      # electron-builder create its own (its set-key-partition-list step fails on
      # the GitHub mac runner even with a valid cert). Then point electron-builder
      # at this keychain via CSC_KEYCHAIN and DON'T pass CSC_LINK, so it signs with
      # the identity already loaded here. The cert itself is verified-good.
      - name: Import Apple signing certificate (macOS)
        if: matrix.os == 'macos-latest'
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KPW="$(openssl rand -base64 24)"
          echo "$CSC_LINK" | base64 -D > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KPW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KPW" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$CSC_KEY_PASSWORD" -k "$KEYCHAIN" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KPW" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"
          echo "CSC_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          echo "imported identity:"; security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Build and publish
        run: npx electron-builder --publish ${{ github.ref_type == 'tag' && 'always' || 'never' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No CSC_LINK here: on macOS the cert is already in CSC_KEYCHAIN (set by
          # the step above), and electron-builder auto-discovers the identity there.
          # Windows/Linux get nothing -> unsigned, as before. APPLE_* is for the
          # notary service and only applies on macOS.
          APPLE_ID: ${{ matrix.os == 'macos-latest' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ matrix.os == 'macos-latest' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ matrix.os == 'macos-latest' && secrets.APPLE_TEAM_ID || '' }}

  # The app does not self-update, so electron-builder's auto-update metadata is
  # just clutter on the release. Runs once after all three builds have uploaded
  # and deletes the *.blockmap and latest*.yml assets, leaving only the three
  # installers. Add electron-updater later? Delete this job.
  tidy:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Remove auto-update metadata assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          id=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" -q .id)
          gh api "repos/${GITHUB_REPOSITORY}/releases/${id}/assets" --paginate \
            -q '.[] | select(.name | test("\\.blockmap$|^latest.*\\.yml$")) | "\(.id)\t\(.name)"' \
          | while IFS=$'\t' read -r asset_id name; do
              echo "removing $name"
              gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}"
            done
