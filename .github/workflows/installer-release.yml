name: Desktop installer release

# Builds the Kaspa Quick Start desktop installer for Windows, macOS and Linux and
# publishes the artifacts to a GitHub Release. Triggered by a version tag, which
# electron-builder also uses as the release tag (so git tag == release tag):
#   git tag v1.0.0 && git push origin v1.0.0
on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop-installer
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      # Temporary: confirm the signing cert imports before electron-builder tries.
      # Prints only public info (sizes, cert name, identity count) -- never keys.
      - name: Diagnose macOS signing cert
        if: matrix.os == 'macos-latest'
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          set +e
          echo "$CSC_LINK" | base64 -D > "$RUNNER_TEMP/c.p12" 2>"$RUNNER_TEMP/b64err"
          if [ ! -s "$RUNNER_TEMP/c.p12" ]; then
            echo "RESULT: CSC_LINK did not decode to any bytes (base64 truncated/wrapped/not base64)."
            cat "$RUNNER_TEMP/b64err"; exit 0
          fi
          echo "decoded .p12 size: $(wc -c < "$RUNNER_TEMP/c.p12") bytes"
          KC="$RUNNER_TEMP/diag.keychain-db"
          security create-keychain -p diagpass "$KC" && security unlock-keychain -p diagpass "$KC"
          security import "$RUNNER_TEMP/c.p12" -k "$KC" -P "$CSC_KEY_PASSWORD" -T /usr/bin/codesign 2>"$RUNNER_TEMP/imp"
          echo "security import exit code: $?"
          echo "import stderr:"; cat "$RUNNER_TEMP/imp"
          echo "--- valid codesigning identities in the keychain ---"
          security find-identity -v -p codesigning "$KC"
          security delete-keychain "$KC" 2>/dev/null; rm -f "$RUNNER_TEMP/c.p12"

      - name: Build and publish
        run: npx electron-builder --publish ${{ github.ref_type == 'tag' && 'always' || 'never' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS signing + notarization. Scoped to the macOS runner only: on
          # Windows/Linux these must be EMPTY, or electron-builder would try to use
          # the Apple cert to sign the Windows build and fail. Empty here just means
          # "unsigned" on those platforms (Windows SmartScreen is a separate cert).
          CSC_LINK: ${{ matrix.os == 'macos-latest' && secrets.CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.os == 'macos-latest' && secrets.CSC_KEY_PASSWORD || '' }}
          APPLE_ID: ${{ matrix.os == 'macos-latest' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ matrix.os == 'macos-latest' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ matrix.os == 'macos-latest' && secrets.APPLE_TEAM_ID || '' }}

  # The app does not self-update, so electron-builder's auto-update metadata is
  # just clutter on the release. Runs once after all three builds have uploaded
  # and deletes the *.blockmap and latest*.yml assets, leaving only the three
  # installers. Add electron-updater later? Delete this job.
  tidy:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Remove auto-update metadata assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          id=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" -q .id)
          gh api "repos/${GITHUB_REPOSITORY}/releases/${id}/assets" --paginate \
            -q '.[] | select(.name | test("\\.blockmap$|^latest.*\\.yml$")) | "\(.id)\t\(.name)"' \
          | while IFS=$'\t' read -r asset_id name; do
              echo "removing $name"
              gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}"
            done
