name: Desktop installer release

# Builds the Kaspa Quick Start desktop installer for Windows, macOS and Linux and
# publishes the artifacts to a GitHub Release. Triggered by a version tag, which
# electron-builder also uses as the release tag (so git tag == release tag):
#   git tag v1.0.0 && git push origin v1.0.0
on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop-installer
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build and publish
        run: npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Builds are unsigned for now. Force-skip the macOS identity lookup so an
          # empty CSC_LINK is not mistaken for a certificate path (that produced the
          # "not a file" failure). To sign later, delete this line and add the
          # signing secrets as env here (see desktop-installer/README.md):
          #   macOS:   CSC_LINK, CSC_KEY_PASSWORD, APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID
          #   Windows: WIN_CSC_LINK, WIN_CSC_KEY_PASSWORD
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
