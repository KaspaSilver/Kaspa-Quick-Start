name: Desktop installer release

# Builds the Kaspa Quick Start desktop installer for Windows, macOS and Linux and
# publishes the artifacts to a GitHub Release. Triggered by a version tag, which
# electron-builder also uses as the release tag (so git tag == release tag):
#   git tag v1.0.0 && git push origin v1.0.0
on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop-installer
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build and publish
        run: npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS signing + notarization. Scoped to the macOS runner only: on
          # Windows/Linux these must be EMPTY, or electron-builder would try to use
          # the Apple cert to sign the Windows build and fail. Empty here just means
          # "unsigned" on those platforms (Windows SmartScreen is a separate cert).
          CSC_LINK: ${{ matrix.os == 'macos-latest' && secrets.CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.os == 'macos-latest' && secrets.CSC_KEY_PASSWORD || '' }}
          APPLE_ID: ${{ matrix.os == 'macos-latest' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ matrix.os == 'macos-latest' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ matrix.os == 'macos-latest' && secrets.APPLE_TEAM_ID || '' }}

  # The app does not self-update, so electron-builder's auto-update metadata is
  # just clutter on the release. Runs once after all three builds have uploaded
  # and deletes the *.blockmap and latest*.yml assets, leaving only the three
  # installers. Add electron-updater later? Delete this job.
  tidy:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Remove auto-update metadata assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          id=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" -q .id)
          gh api "repos/${GITHUB_REPOSITORY}/releases/${id}/assets" --paginate \
            -q '.[] | select(.name | test("\\.blockmap$|^latest.*\\.yml$")) | "\(.id)\t\(.name)"' \
          | while IFS=$'\t' read -r asset_id name; do
              echo "removing $name"
              gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}"
            done
