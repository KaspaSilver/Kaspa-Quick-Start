<!--
  The Kaspa mark: an irregular teal blob with the dark K off-centre, its chevron
  pointing into the upright.

  Drawn here rather than fetched, so the panel needs nothing external. The shape
  fills the viewBox on purpose: anything smaller leaves a margin that shows up as
  a gap once the mark is 22px in the sidebar.

  Replace this file to use different artwork. It is referenced by name and
  nothing else has to change.
-->
